<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🦖 Quarkusaurus · Dino To-Do</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>" />
  <style>
    :root {
      --jungle-deep: #0f2417;
      --jungle: #163a25;
      --moss: #2e6b3e;
      --leaf: #4caf50;
      --lime: #9ccc65;
      --sand: #f4e4c1;
      --bone: #fffaf0;
      --lava: #ff7043;
      --amber: #ffb74d;
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--bone);
      background:
        radial-gradient(circle at 15% 15%, #1d4a2e 0, transparent 45%),
        radial-gradient(circle at 85% 10%, #1a4029 0, transparent 40%),
        linear-gradient(160deg, var(--jungle-deep) 0%, var(--jungle) 60%, #0c1d12 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem 4rem;
    }

    .app {
      width: 100%;
      max-width: 640px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .dino {
      font-size: 4.5rem;
      display: inline-block;
      filter: drop-shadow(0 6px 8px var(--shadow));
      animation: stomp 2.4s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes stomp {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      25%      { transform: translateY(-10px) rotate(2deg); }
      50%      { transform: translateY(0) rotate(-2deg); }
      75%      { transform: translateY(-4px) rotate(1deg); }
    }

    h1 {
      margin: 0.4rem 0 0.2rem;
      font-size: 2.4rem;
      letter-spacing: 0.5px;
      color: var(--lime);
      text-shadow: 0 3px 0 #0a1c11;
    }

    .tagline {
      margin: 0;
      color: var(--sand);
      opacity: 0.85;
      font-style: italic;
    }

    .hatchery {
      background: linear-gradient(155deg, var(--moss), var(--jungle));
      border: 2px solid var(--leaf);
      border-radius: 18px;
      padding: 1.4rem;
      box-shadow: 0 14px 30px var(--shadow);
      margin-bottom: 2rem;
    }

    .hatchery h2 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      color: var(--lime);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .field { margin-bottom: 0.9rem; }

    label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 0.3rem;
      color: var(--sand);
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 10px;
      border: 2px solid transparent;
      background: var(--bone);
      color: #20331f;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    textarea { resize: vertical; min-height: 60px; }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(255, 183, 77, 0.3);
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }

    .hatch-btn {
      width: 100%;
      margin-top: 0.3rem;
      padding: 0.85rem;
      font-size: 1.05rem;
      color: #2a1505;
      background: linear-gradient(135deg, var(--amber), var(--lava));
      border: none;
      border-radius: 12px;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 0 #b5481f;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .hatch-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #b5481f; }
    .hatch-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b5481f; }
    .hatch-btn:disabled { opacity: 0.6; cursor: wait; }

    .nest-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .nest-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--lime);
    }

    .count {
      background: var(--lava);
      color: var(--bone);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
    }

    ul { list-style: none; margin: 0; padding: 0; }

    li.task {
      background: var(--bone);
      color: #20331f;
      border-left: 6px solid var(--leaf);
      border-radius: 12px;
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 6px 14px var(--shadow);
      animation: hatch 0.35s ease;
    }

    @keyframes hatch {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    li.task .title {
      font-weight: bold;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    li.task .desc {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      color: #4a5a44;
    }

    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--sand);
      opacity: 0.8;
    }

    .empty .big { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: var(--sand);
      opacity: 0.6;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--lava);
      color: var(--bone);
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px var(--shadow);
      transition: transform 0.3s ease, visibility 0.3s ease;
      visibility: hidden;
      z-index: 10;
    }
    .toast.show { transform: translateX(-50%) translateY(0); visibility: visible; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <span class="dino" aria-hidden="true">🦖</span>
      <h1>Quarkusaurus</h1>
      <p class="tagline">Hatch your tasks before they go extinct.</p>
    </header>

    <section class="hatchery">
      <h2>🥚 Lay a new task-egg</h2>
      <form id="task-form">
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" placeholder="e.g. Feed the raptors" required maxlength="120" />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="What needs to roar to life?"></textarea>
        </div>
        <button type="submit" class="hatch-btn" id="submit-btn">🦴 Hatch it!</button>
      </form>
    </section>

    <section class="nest">
      <div class="nest-header">
        <h2>🪺 The Nest</h2>
        <span class="count" id="count">0</span>
      </div>
      <ul id="task-list"></ul>
    </section>

    <footer>Powered by Quarkus 🦕 · served straight from the jungle</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "/tasks";
    const listEl = document.getElementById("task-list");
    const countEl = document.getElementById("count");
    const form = document.getElementById("task-form");
    const submitBtn = document.getElementById("submit-btn");
    const toastEl = document.getElementById("toast");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function render(tasks) {
      countEl.textContent = tasks.length;
      if (!tasks.length) {
        listEl.innerHTML =
          '<li class="empty"><span class="big">🦴</span>No tasks yet — the nest is quiet. Lay the first egg above!</li>';
        return;
      }
      listEl.innerHTML = tasks
        .map(
          (t) => `
            <li class="task">
              <div class="title">🦕 ${escapeHtml(t.title)}</div>
              ${t.description ? `<p class="desc">${escapeHtml(t.description)}</p>` : ""}
            </li>`
        )
        .join("");
    }

    async function loadTasks() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
      } catch (err) {
        toast("Couldn't reach the jungle 🌋");
        console.error(err);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      if (!title) return;

      submitBtn.disabled = true;
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, description }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        form.reset();
        document.getElementById("title").focus();
        await loadTasks();
        toast("Task hatched! 🐣");
      } catch (err) {
        toast("The egg cracked 🥚💥");
        console.error(err);
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadTasks();
  </script>
</body>
</html>
